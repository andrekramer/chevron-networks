[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "value-policy"
version = "0.1.0"
description = "Contextual reversal bandit experiments for Value / Policy Chevron models"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "torch>=2.2",
]

[tool.setuptools]
packages = ["value_policy"]
