[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chevron-agent"
version = "0.1.0"
description = "Minimal PyTorch proof of concept for Chevron proposal/norm RL agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=0.29",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "torch>=2.2",
]

[tool.setuptools.packages.find]
include = ["chevron_agent*"]
